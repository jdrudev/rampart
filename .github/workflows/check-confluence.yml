name: Check Confluence credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check authentication and publication access
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_CLOUD_ID: ${{ vars.CONFLUENCE_CLOUD_ID }}
          CONFLUENCE_SPACE: ${{ vars.CONFLUENCE_SPACE || 'Portfolio' }}
          CONFLUENCE_CONTENT_TYPE: ${{ vars.CONFLUENCE_CONTENT_TYPE || 'page' }}
        run: python -m scripts.confluence.check_credentials