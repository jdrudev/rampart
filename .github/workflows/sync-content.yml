name: Sync Confluence content

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync explicitly published pages
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: python -m scripts.confluence.sync
      - run: python scripts/validation/validate_content.py
      - name: Commit changed content
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add content/
          git diff --cached --quiet || git commit -m "chore(content): sync Confluence"
          git push