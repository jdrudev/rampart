name: Sync Confluence content

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Confluence gateway configuration
        env:
          CONFLUENCE_CLOUD_ID: ${{ vars.CONFLUENCE_CLOUD_ID }}
        run: |
          if [[ -z "$CONFLUENCE_CLOUD_ID" ]]; then
            echo "::error::Repository variable CONFLUENCE_CLOUD_ID is required for scoped Confluence tokens."
            exit 1
          fi
      - name: Sync explicitly published pages
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_CLOUD_ID: ${{ vars.CONFLUENCE_CLOUD_ID }}
          CONFLUENCE_SPACE: ${{ vars.CONFLUENCE_SPACE || 'Portfolio' }}
          CONFLUENCE_CONTENT_TYPE: ${{ vars.CONFLUENCE_CONTENT_TYPE || 'page' }}
        run: python -m scripts.confluence.sync
      - run: python scripts/validation/validate_content.py
      - name: Commit changed content
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add content/
          git diff --cached --quiet || git commit -m "chore(content): sync Confluence"
          git push